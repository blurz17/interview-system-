services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerpilot} -d ${POSTGRES_DB:-careerpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: careerpilot-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD:-careerpilot}@postgres:5432/${POSTGRES_DB:-careerpilot}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development_jwt_secret_key_32_bytes_min}
      - JUDGE0_API_URL=${JUDGE0_API_URL:-http://judge0-server:2358}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./storage:/workspace/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: careerpilot-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/workspace/apps/web
      - /workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
