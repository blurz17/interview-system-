name: CareerPilot CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      JWT_SECRET_KEY: test_secret_key_minimum_length_for_ci_checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint and Format check
        run: |
          cd apps/api
          ruff check .
          ruff format --check .

      - name: Run Pytest
        run: |
          cd apps/api
          pytest tests/ -v

  frontend-checks:
    name: Frontend Lint, Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Run TypeScript type check
        run: |
          cd apps/web
          npm run typecheck

      - name: Run Vitest Unit Tests
        run: |
          cd apps/web
          npm run test:run
